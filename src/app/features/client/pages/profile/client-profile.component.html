<div class="map-shell">
  
  <!-- ── Profile header ────────────────────────────────────────────── -->
  <div class="profile-hero">
    <!-- Background decoration -->
    <div class="hero-bg-orb"></div>

    <!-- Avatar -->
    <div class="profile-avatar-wrap">
      @if (loading()) {
        <div class="profile-avatar-placeholder">
          <div class="animate-pulse"></div>
        </div>
      } @else {
        @if (user()?.avatar) {
          <img
            class="profile-avatar"
            [src]="user()!.avatar"
            [alt]="user()?.full_name || 'Avatar'"
            (error)="$any($event.target).src='/assets/images/default-avatar.png'" />
        } @else {
          <div class="profile-avatar-placeholder">
            <svg class="w-10 h-10 text-white/60" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
        }
      }
    </div>

    <h2 class="profile-name">{{ user()?.full_name || 'Usuario' }}</h2>
    <p class="profile-email">{{ user()?.email }}</p>
  </div>

  <!-- ── Info quick cards ───────────────────────────────────────────── -->
  <div class="info-row">
    <div class="info-card">
      <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
      <span class="info-label">Teléfono</span>
      <span class="info-value">{{ user()?.phone || 'Sin registrar' }}</span>
    </div>
    <div class="info-card">
      <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <span class="info-label">Email</span>
      <span class="info-value">{{ user()?.email }}</span>
    </div>
  </div>

  <!-- ── Menu: cuenta ──────────────────────────────────────────────── -->
  <div class="menu-section">
    <p class="menu-section-label">Cuenta</p>

    <div class="menu-list">
      <button class="menu-item" (click)="goToEditProfile()" type="button">
        <div class="menu-icon menu-icon-blue">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span class="menu-label">Editar perfil</span>
        <svg class="menu-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <button class="menu-item" (click)="goToTransactions()" type="button">
        <div class="menu-icon menu-icon-green">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <span class="menu-label">Mis Compras</span>
        <svg class="menu-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <button class="menu-item" (click)="goToCatalog()" type="button">
        <div class="menu-icon menu-icon-gold">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
        </div>
        <span class="menu-label">Tienda Premium</span>
        <div class="menu-tag">Premium</div>
        <svg class="menu-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Menu: preferencias ────────────────────────────────────────── -->
  <div class="menu-section">
    <p class="menu-section-label">Preferencias</p>

    <div class="menu-list">
      <button class="menu-item" (click)="goToSettings()" type="button">
        <div class="menu-icon menu-icon-slate">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          </svg>
        </div>
        <span class="menu-label">Configuración</span>
        <svg class="menu-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <button class="menu-item" (click)="inviteFriends()" type="button">
        <div class="menu-icon menu-icon-violet">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <span class="menu-label">Invitar amigos</span>
        <svg class="menu-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <button class="menu-item" (click)="goToTerms()" type="button">
        <div class="menu-icon menu-icon-orange">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <span class="menu-label">Términos y condiciones</span>
        <svg class="menu-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Logout ─────────────────────────────────────────────────────── -->
  <div class="logout-wrap">
    <button class="logout-btn" (click)="goLogout()" type="button">
      <svg fill="currentColor" viewBox="0 0 24 24">
        <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a2 2 0 01-2-2V7a2 2 0 012-2h4a3 3 0 013 3v1"/>
      </svg>
      <span>Cerrar sesión</span>
    </button>
  </div>

  <div class="profile-footer-spacer"></div>

  <footer class="app-footer">
    <div class="footer-inner">
      <span class="footer-brand">BappSearch</span>
      <nav class="footer-links" aria-label="Enlaces de pie">
        <a href="/client/tabs/service-search">Buscar</a>
        <a href="/terms">Términos</a>
        <a href="/privacy">Privacidad</a>
      </nav>
      <span class="footer-copy">© 2026 BappSearch.</span>
    </div>
  </footer>
</div>
