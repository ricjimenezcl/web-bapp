<footer class="app-footer" [class.app-footer--compact]="compact">
  <div class="footer-inner">

    <!-- Brand -->
    <div class="footer-brand">
      <a class="footer-logo" routerLink="/">
        <img src="https://res.cloudinary.com/dghwotofx/image/upload/f_auto,q_auto,w_320,c_limit/v1774563936/logo_gsgyrf.png"
             alt="Logo BappSearch" class="footer-brand-image footer-brand-image--mark object-contain">
        <img src="https://res.cloudinary.com/dghwotofx/image/upload/v1774563936/titulo_bycrju.png"
             alt="BappSearch" class="footer-brand-image footer-brand-image--word hidden sm:block object-contain">
      </a>
      <p class="footer-tagline">Conectando clientes con proveedores de confianza.</p>

      <div class="footer-social" aria-label="Redes sociales">
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.24 10.44 22v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.88 3.77-3.88 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.62.77-1.62 1.56v1.88h2.76l-.44 2.9h-2.32V22C18.34 21.24 22 17.08 22 12.06z"/>
          </svg>
        </a>
        <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm8.5 1.8h-8.5A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95zM12 7.9a4.1 4.1 0 1 1 0 8.2 4.1 4.1 0 0 1 0-8.2zm0 1.8a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6zm4.55-2.65a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="footer-nav" aria-label="Navegación del pie">

      <div class="footer-nav-group">
        <span class="footer-nav-title">Legal</span>
        <a routerLink="/terms">Términos y condiciones</a>
        <a routerLink="/privacy">Política de privacidad</a>
      </div>

      <div class="footer-nav-group">
        <span class="footer-nav-title">Soporte</span>
        <a routerLink="/terms">Preguntas frecuentes</a>
        <a href="mailto:soporte@bappsearch.com">Contáctanos</a>
      </div>

    </nav>

  </div>

  <!-- Bottom bar -->
  <div class="footer-bottom">
    <span class="footer-copy">© {{ year }} BappSearch. Todos los derechos reservados.</span>
    <div class="footer-bottom-links">
      <a routerLink="/terms">Términos</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a routerLink="/privacy">Privacidad</a>
    </div>
  </div>

</footer>
