name: QA — web-bapp

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: qa-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Unit Tests (Karma / Jasmine)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Karma)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (headless + coverage)
        run: npm run test:ci
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web-unit
          path: coverage/web-bapp/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Build (verifica que compila sin errores)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (producción)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build production
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: E2E Tests (Playwright)
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npm run e2e:ci
        env:
          CI: true
          BASE_URL: http://localhost:4200

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-web
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots/videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-web
          path: e2e/test-results/
          retention-days: 7
