name: Production Smoke — web-bapp

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: prod-smoke-web
  cancel-in-progress: true

jobs:
  smoke-prod:
    name: Playwright Smoke (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run non-destructive smoke on production
        env:
          CI: true
          BASE_URL: ${{ secrets.PROD_WEB_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Missing secret PROD_WEB_BASE_URL"
            exit 1
          fi
          npm run e2e:smoke:prod

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-failures
          path: e2e/test-results/
          retention-days: 14
