<div class="map-shell">

  <!-- Hero header -->
  <div class="profile-hero" style="padding-bottom:20px">
    <div class="hero-bg-orb"></div>
    <div class="flex items-center gap-3 w-full">
      <button (click)="history.back()"
        class="w-9 h-9 rounded-full bg-surface-hover flex items-center justify-center text-text-secondary hover:text-text-primary flex-shrink-0 transition-colors"
        aria-label="Volver">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="profile-name flex-1" style="text-align:left;font-size:1.1rem">Notificaciones</h1>
      @if (notifState.hasUnread()) {
        <button (click)="markAllRead()"
          class="text-xs text-primary font-semibold hover:text-primary-600 transition-colors">
          Marcar todo leído
        </button>
      }
    </div>
  </div>

  <!-- Lista -->
  @if (notifications().length === 0) {
    <div class="menu-section">
      <div class="menu-list">
        <div style="padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:10px">
          <div class="menu-icon menu-icon-slate" style="width:48px;height:48px">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
          </div>
          <p class="menu-label" style="text-align:center">Sin notificaciones</p>
          <p class="info-label" style="text-align:center">Aquí aparecerán tus notificaciones.</p>
        </div>
      </div>
    </div>
  } @else {
    <div class="menu-section">
      <div class="menu-list">
        @for (n of notifications(); track n.id) {
          <div (click)="markRead(n)"
            class="menu-item"
            [class.bg-primary-50]="!n.is_read"
            style="cursor:pointer;align-items:flex-start">

            <!-- Ícono tipo notificación -->
            <div class="menu-icon flex-shrink-0"
              [class]="!n.is_read ? 'menu-icon-gold' : 'menu-icon-slate'">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                @switch (n.notification_type) {
                  @case ('message') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                  }
                  @case ('chat_message') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                  }
                  @case ('booking_confirmed') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  }
                  @case ('review_received') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                  }
                  @default {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                  }
                }
              </svg>
            </div>

            <!-- Contenido -->
            <div class="flex-1 min-w-0">
              <p class="menu-label truncate">{{ n.title }}</p>
              <p class="info-label line-clamp-2 mt-0.5" style="text-transform:none;letter-spacing:0;font-size:0.78rem">{{ n.content }}</p>
              <p style="font-size:0.7rem;color:rgba(255,255,255,0.32);margin-top:4px">{{ n.created_at | date:'dd/MM/yyyy HH:mm' }}</p>
            </div>

            <!-- Punto de no leído -->
            @if (!n.is_read) {
              <div class="w-2 h-2 bg-primary rounded-full mt-1.5 flex-shrink-0"></div>
            }
          </div>
        }
      </div>
    </div>
  }

  <div class="profile-footer-spacer"></div>
</div>
